[workspace]
resolver = "3"
members = ["crates/folio-core", "crates/folio-cli", "app"]

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.90"
publish = false

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = true

# Тесты и отладочная сборка быстрее, когда зависимости оптимизированы: SQLite, libgit2 и YAML.
[profile.dev.package."*"]
opt-level = 2
